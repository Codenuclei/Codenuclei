name: Update Live Stats

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore:
      - "assets/live-stats.svg"

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate live stats SVG
        env:
          GH_USERNAME: Codenuclei
          # GH_TOKEN: the Actions-provided token, auto-issued per run,
          # never stored, never configured by hand. Only used for basic
          # authenticated REST/search calls (repo counts, PR counts).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GH_USER_TOKEN: optional. A fine-grained PAT with ONLY the
          # "read:user" scope, added by hand as a repo secret named
          # STATS_PAT (Settings -> Secrets and variables -> Actions).
          # It is never printed, echoed, or exposed in logs. Needed only
          # for the contribution-calendar figure; everything else in the
          # card still renders correctly if this is left unset.
          GH_USER_TOKEN: ${{ secrets.STATS_PAT }}
        run: python3 scripts/generate_stats.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/live-stats.svg
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: refresh live stats [skip ci]"
            git push
          fi
