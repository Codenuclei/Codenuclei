name: Update Live Stats

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore:
      - "assets/live-stats.svg"

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate live stats SVG
        env:
          GH_USERNAME: Codenuclei
          # GH_USER_TOKEN: optional. A fine-grained PAT with ONLY the
          # "read:user" scope, added by hand as a repo secret named
          # STATS_PAT (Settings -> Secrets and variables -> Actions).
          # It is never printed, echoed, or exposed in logs. Needed for
          # accurate PR counts and the contribution-calendar figure; repo
          # and follower counts still render correctly if left unset.
          GH_USER_TOKEN: ${{ secrets.STATS_PAT }}
        run: python3 scripts/generate_stats.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/live-stats.svg
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: refresh live stats [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin main && break
            echo "push attempt $i failed, retrying..."
            sleep 3
          done
