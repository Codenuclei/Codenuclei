<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <!-- Dither pattern -->
    <pattern id="dither" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#0d1117"/>
      <rect width="1" height="1" x="0" y="0" fill="#00ff41" opacity="0.15"/>
      <rect width="1" height="1" x="2" y="2" fill="#00ff41" opacity="0.15"/>
    </pattern>
    
    <!-- Scanline pattern -->
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity="0.3"/>
    </pattern>
    
    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Phosphor glow -->
    <filter id="phosphor" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="20" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <style>
    @keyframes flicker {
      0%, 100% { opacity: 1; }
      92% { opacity: 1; }
      93% { opacity: 0.8; }
      94% { opacity: 1; }
      96% { opacity: 0.9; }
      97% { opacity: 1; }
    }
    
    @keyframes scanline-move {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(100%); }
    }
    
    @keyframes typewriter {
      from { width: 0; }
      to { width: 100%; }
    }
    
    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    
    @keyframes pulse-glow {
      0%, 100% { filter: url(#glow); opacity: 1; }
      50% { filter: url(#phosphor); opacity: 0.9; }
    }
    
    .crt-screen {
      animation: flicker 4s infinite;
    }
    
    .scanline-bar {
      animation: scanline-move 8s linear infinite;
    }
    
    .glow-text {
      filter: url(#glow);
      animation: pulse-glow 3s ease-in-out infinite;
    }
    
    .float-anim {
      animation: float 6s ease-in-out infinite;
    }
    
    .cursor-blink {
      animation: blink 1s step-end infinite;
    }
    
    text {
      font-family: 'Fira Code', 'JetBrains Mono', monospace;
    }
  </style>
  
  <!-- Background -->
  <rect width="1200" height="300" fill="#0d1117"/>
  <rect width="1200" height="300" fill="url(#dither)"/>
  
  <!-- CRT scanlines overlay -->
  <rect width="1200" height="300" fill="url(#scanlines)" class="crt-screen"/>
  
  <!-- Animated scanline bar -->
  <rect x="0" y="0" width="1200" height="4" fill="#00ff41" opacity="0.1" class="scanline-bar"/>
  
  <!-- Vignette -->
  <rect width="1200" height="300" fill="none" stroke="#000" stroke-width="40" opacity="0.3" rx="20"/>
  
  <!-- Main content -->
  <g class="float-anim">
    <!-- Title -->
    <text x="600" y="100" text-anchor="middle" fill="#00ff41" font-size="64" font-weight="bold" class="glow-text" letter-spacing="8">CODENUCLEI</text>
    
    <!-- Subtitle with typing effect -->
    <text x="600" y="150" text-anchor="middle" fill="#58a6ff" font-size="20" class="glow-text">
      <tspan>GPU</tspan>
      <tspan fill="#00ff41"> • </tspan>
      <tspan>CUDA</tspan>
      <tspan fill="#00ff41"> • </tspan>
      <tspan>AI INFERENCE</tspan>
      <tspan fill="#00ff41"> • </tspan>
      <tspan>WEB3</tspan>
    </text>
    
    <!-- Terminal line -->
    <text x="600" y="200" text-anchor="middle" fill="#7d8590" font-size="14">
      <tspan>$ </tspan>
      <tspan fill="#00ff41">whoami</tspan>
      <tspan class="cursor-blink" fill="#00ff41">_</tspan>
    </text>
    
    <!-- Status -->
    <text x="600" y="230" text-anchor="middle" fill="#00ff41" font-size="12" opacity="0.8">kernel-aware • gpu-native • chain-ready</text>
  </g>
  
  <!-- Corner brackets -->
  <g stroke="#00ff41" stroke-width="2" fill="none" opacity="0.6">
    <path d="M 20 40 L 20 20 L 40 20"/>
    <path d="M 1160 20 L 1180 20 L 1180 40"/>
    <path d="M 20 260 L 20 280 L 40 280"/>
    <path d="M 1180 260 L 1180 280 L 1160 280"/>
  </g>
  
  <!-- Pixel decorations -->
  <g fill="#00ff41" opacity="0.4">
    <rect x="50" y="50" width="4" height="4"/>
    <rect x="60" y="55" width="4" height="4"/>
    <rect x="55" y="60" width="4" height="4"/>
    
    <rect x="1150" y="50" width="4" height="4"/>
    <rect x="1140" y="55" width="4" height="4"/>
    <rect x="1145" y="60" width="4" height="4"/>
    
    <rect x="50" y="250" width="4" height="4"/>
    <rect x="60" y="245" width="4" height="4"/>
    <rect x="55" y="240" width="4" height="4"/>
    
    <rect x="1150" y="250" width="4" height="4"/>
    <rect x="1140" y="245" width="4" height="4"/>
    <rect x="1145" y="240" width="4" height="4"/>
  </g>
</svg>
