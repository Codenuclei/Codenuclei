<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#21262d" stroke-width="0.5"/>
    </pattern>
    
    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <style>
    @keyframes border-pulse {
      0%, 100% { stroke-opacity: 0.3; }
      50% { stroke-opacity: 0.8; }
    }
    
    @keyframes icon-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    
    .domain-card {
      animation: border-pulse 4s ease-in-out infinite;
    }
    
    .domain-icon {
      animation: icon-float 3s ease-in-out infinite;
    }
    
    text {
      font-family: 'Fira Code', monospace;
    }
  </style>
  
  <rect width="1200" height="200" fill="#0d1117"/>
  <rect width="1200" height="200" fill="url(#grid)"/>
  
  <!-- GPU/CUDA -->
  <g class="domain-card">
    <rect x="50" y="30" width="260" height="140" fill="#161b22" stroke="#00ff41" stroke-width="1" rx="4"/>
    <text x="180" y="60" text-anchor="middle" fill="#00ff41" font-size="14" font-weight="bold" filter="url(#neon)">GPU / CUDA</text>
    <text x="180" y="90" text-anchor="middle" fill="#c9d1d9" font-size="11">Browser Playground</text>
    <text x="180" y="110" text-anchor="middle" fill="#c9d1d9" font-size="11">accel-sim Profiler</text>
    <text x="180" y="130" text-anchor="middle" fill="#c9d1d9" font-size="11">Warp Divergence Viz</text>
    <text x="180" y="155" text-anchor="middle" fill="#58a6ff" font-size="10" class="domain-icon">▲ ▼ ◄ ►</text>
  </g>
  
  <!-- AI Inference -->
  <g class="domain-card">
    <rect x="330" y="30" width="260" height="140" fill="#161b22" stroke="#bc8cff" stroke-width="1" rx="4"/>
    <text x="460" y="60" text-anchor="middle" fill="#bc8cff" font-size="14" font-weight="bold" filter="url(#neon)">AI INFERENCE</text>
    <text x="460" y="90" text-anchor="middle" fill="#c9d1d9" font-size="11">Local Ollama Pipelines</text>
    <text x="460" y="110" text-anchor="middle" fill="#c9d1d9" font-size="11">Prompt Enhancers</text>
    <text x="460" y="130" text-anchor="middle" fill="#c9d1d9" font-size="11">Multimodal Indexing</text>
    <text x="460" y="155" text-anchor="middle" fill="#58a6ff" font-size="10" class="domain-icon">◉ ◎ ○ ●</text>
  </g>
  
  <!-- Systems -->
  <g class="domain-card">
    <rect x="610" y="30" width="260" height="140" fill="#161b22" stroke="#f85149" stroke-width="1" rx="4"/>
    <text x="740" y="60" text-anchor="middle" fill="#f85149" font-size="14" font-weight="bold" filter="url(#neon)">SYSTEMS</text>
    <text x="740" y="90" text-anchor="middle" fill="#c9d1d9" font-size="11">Win32 Kernel Schedulers</text>
    <text x="740" y="110" text-anchor="middle" fill="#c9d1d9" font-size="11">Multicore Load Balancing</text>
    <text x="740" y="130" text-anchor="middle" fill="#c9d1d9" font-size="11">Real-time Telemetry</text>
    <text x="740" y="155" text-anchor="middle" fill="#58a6ff" font-size="10" class="domain-icon">█ ▓ ▒ ░</text>
  </g>
  
  <!-- Web3 -->
  <g class="domain-card">
    <rect x="890" y="30" width="260" height="140" fill="#161b22" stroke="#3fb950" stroke-width="1" rx="4"/>
    <text x="1020" y="60" text-anchor="middle" fill="#3fb950" font-size="14" font-weight="bold" filter="url(#neon)">WEB3</text>
    <text x="1020" y="90" text-anchor="middle" fill="#c9d1d9" font-size="11">Solana + IPFS Storage</text>
    <text x="1020" y="110" text-anchor="middle" fill="#c9d1d9" font-size="11">Blockchain Voting</text>
    <text x="1020" y="130" text-anchor="middle" fill="#c9d1d9" font-size="11">Decentralized Identity</text>
    <text x="1020" y="155" text-anchor="middle" fill="#58a6ff" font-size="10" class="domain-icon">⬡ ⬢ ⬡ ⬢</text>
  </g>
</svg>
