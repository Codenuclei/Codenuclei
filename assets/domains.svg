<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350">
  <defs>
    <!-- Liquid glass card filter -->
    <filter id="glass" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="8"/>
    </filter>
    
    <!-- Soft glow -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Gradients -->
    <linearGradient id="gpuGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#76b900"/>
      <stop offset="100%" stop-color="#00ff41"/>
    </linearGradient>
    
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bc8cff"/>
      <stop offset="100%" stop-color="#ff0080"/>
    </linearGradient>
    
    <linearGradient id="sysGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f85149"/>
      <stop offset="100%" stop-color="#ff6b35"/>
    </linearGradient>
    
    <linearGradient id="web3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3fb950"/>
      <stop offset="100%" stop-color="#00d4aa"/>
    </linearGradient>
  </defs>
  
  <style>
    @keyframes card-float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-8px) rotate(0.5deg); }
      50% { transform: translateY(-4px) rotate(0deg); }
      75% { transform: translateY(-12px) rotate(-0.5deg); }
    }
    
    @keyframes icon-spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    @keyframes border-flow {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 200; }
    }
    
    @keyframes particle-rise {
      0% { transform: translateY(0); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-80px); opacity: 0; }
    }
    
    .card { animation: card-float 6s ease-in-out infinite; }
    .card:nth-child(2) { animation-delay: -1.5s; }
    .card:nth-child(3) { animation-delay: -3s; }
    .card:nth-child(4) { animation-delay: -4.5s; }
    
    .icon-spin { animation: icon-spin 20s linear infinite; }
    .border-flow { animation: border-flow 3s linear infinite; }
    .particle { animation: particle-rise 4s ease-out infinite; }
    
    text { font-family: 'SF Mono', 'Fira Code', monospace; }
  </style>
  
  <rect width="1200" height="350" fill="#0a0a0f"/>
  
  <!-- GPU/CUDA Card -->
  <g class="card" transform="translate(50, 50)">
    <rect width="260" height="250" rx="16" fill="#161b22" stroke="url(#gpuGrad)" stroke-width="2" filter="url(#glass)" opacity="0.9"/>
    <rect width="260" height="250" rx="16" fill="none" stroke="url(#gpuGrad)" stroke-width="1" opacity="0.3" class="border-flow" stroke-dasharray="50,150"/>
    
    <circle cx="130" cy="60" r="25" fill="url(#gpuGrad)" opacity="0.2" filter="url(#softGlow)"/>
    <text x="130" y="70" text-anchor="middle" fill="url(#gpuGrad)" font-size="24" font-weight="bold" filter="url(#softGlow)">GPU</text>
    
    <text x="130" y="110" text-anchor="middle" fill="#c9d1d9" font-size="13" font-weight="bold">CUDA / COMPUTE</text>
    
    <text x="130" y="140" text-anchor="middle" fill="#7d8590" font-size="11">Browser Playground</text>
    <text x="130" y="160" text-anchor="middle" fill="#7d8590" font-size="11">accel-sim Profiler</text>
    <text x="130" y="180" text-anchor="middle" fill="#7d8590" font-size="11">Warp Divergence Viz</text>
    
    <!-- Floating particles -->
    <circle cx="50" cy="200" r="2" fill="#76b900" class="particle" style="animation-delay: 0s"/>
    <circle cx="130" cy="210" r="1.5" fill="#00ff41" class="particle" style="animation-delay: -1s"/>
    <circle cx="210" cy="200" r="2" fill="#76b900" class="particle" style="animation-delay: -2s"/>
  </g>
  
  <!-- AI Inference Card -->
  <g class="card" transform="translate(330, 50)">
    <rect width="260" height="250" rx="16" fill="#161b22" stroke="url(#aiGrad)" stroke-width="2" filter="url(#glass)" opacity="0.9"/>
    <rect width="260" height="250" rx="16" fill="none" stroke="url(#aiGrad)" stroke-width="1" opacity="0.3" class="border-flow" stroke-dasharray="50,150"/>
    
    <circle cx="130" cy="60" r="25" fill="url(#aiGrad)" opacity="0.2" filter="url(#softGlow)"/>
    <text x="130" y="70" text-anchor="middle" fill="url(#aiGrad)" font-size="24" font-weight="bold" filter="url(#softGlow)">AI</text>
    
    <text x="130" y="110" text-anchor="middle" fill="#c9d1d9" font-size="13" font-weight="bold">INFERENCE</text>
    
    <text x="130" y="140" text-anchor="middle" fill="#7d8590" font-size="11">Local Ollama Pipelines</text>
    <text x="130" y="160" text-anchor="middle" fill="#7d8590" font-size="11">Prompt Enhancers</text>
    <text x="130" y="180" text-anchor="middle" fill="#7d8590" font-size="11">Multimodal Indexing</text>
    
    <circle cx="50" cy="200" r="2" fill="#bc8cff" class="particle" style="animation-delay: -0.5s"/>
    <circle cx="130" cy="210" r="1.5" fill="#ff0080" class="particle" style="animation-delay: -1.5s"/>
    <circle cx="210" cy="200" r="2" fill="#bc8cff" class="particle" style="animation-delay: -2.5s"/>
  </g>
  
  <!-- Systems Card -->
  <g class="card" transform="translate(610, 50)">
    <rect width="260" height="250" rx="16" fill="#161b22" stroke="url(#sysGrad)" stroke-width="2" filter="url(#glass)" opacity="0.9"/>
    <rect width="260" height="250" rx="16" fill="none" stroke="url(#sysGrad)" stroke-width="1" opacity="0.3" class="border-flow" stroke-dasharray="50,150"/>
    
    <circle cx="130" cy="60" r="25" fill="url(#sysGrad)" opacity="0.2" filter="url(#softGlow)"/>
    <text x="130" y="70" text-anchor="middle" fill="url(#sysGrad)" font-size="24" font-weight="bold" filter="url(#softGlow)">SYS</text>
    
    <text x="130" y="110" text-anchor="middle" fill="#c9d1d9" font-size="13" font-weight="bold">KERNEL / LOW-LEVEL</text>
    
    <text x="130" y="140" text-anchor="middle" fill="#7d8590" font-size="11">Win32 Schedulers</text>
    <text x="130" y="160" text-anchor="middle" fill="#7d8590" font-size="11">Multicore Load Balancing</text>
    <text x="130" y="180" text-anchor="middle" fill="#7d8590" font-size="11">Real-time Telemetry</text>
    
    <circle cx="50" cy="200" r="2" fill="#f85149" class="particle" style="animation-delay: -1s"/>
    <circle cx="130" cy="210" r="1.5" fill="#ff6b35" class="particle" style="animation-delay: -2s"/>
    <circle cx="210" cy="200" r="2" fill="#f85149" class="particle" style="animation-delay: -3s"/>
  </g>
  
  <!-- Web3 Card -->
  <g class="card" transform="translate(890, 50)">
    <rect width="260" height="250" rx="16" fill="#161b22" stroke="url(#web3Grad)" stroke-width="2" filter="url(#glass)" opacity="0.9"/>
    <rect width="260" height="250" rx="16" fill="none" stroke="url(#web3Grad)" stroke-width="1" opacity="0.3" class="border-flow" stroke-dasharray="50,150"/>
    
    <circle cx="130" cy="60" r="25" fill="url(#web3Grad)" opacity="0.2" filter="url(#softGlow)"/>
    <text x="130" y="70" text-anchor="middle" fill="url(#web3Grad)" font-size="24" font-weight="bold" filter="url(#softGlow)">W3</text>
    
    <text x="130" y="110" text-anchor="middle" fill="#c9d1d9" font-size="13" font-weight="bold">BLOCKCHAIN</text>
    
    <text x="130" y="140" text-anchor="middle" fill="#7d8590" font-size="11">Solana + IPFS Storage</text>
    <text x="130" y="160" text-anchor="middle" fill="#7d8590" font-size="11">Blockchain Voting</text>
    <text x="130" y="180" text-anchor="middle" fill="#7d8590" font-size="11">Decentralized Identity</text>
    
    <circle cx="50" cy="200" r="2" fill="#3fb950" class="particle" style="animation-delay: -1.5s"/>
    <circle cx="130" cy="210" r="1.5" fill="#00d4aa" class="particle" style="animation-delay: -2.5s"/>
    <circle cx="210" cy="200" r="2" fill="#3fb950" class="particle" style="animation-delay: -3.5s"/>
  </g>
</svg>
