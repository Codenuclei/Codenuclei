    .bar { transform-origin: left; animation: barGrow 1.2s cubic-bezier(.16,1,.3,1) forwards; }
    text { font-family: 'SF Mono','Fira Code',monospace; }
  </style>
  <rect width="1152" height="290" fill="url(#bg)" rx="16"/>
  
