<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#9b5de5" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0a0a0f" stop-opacity="0"/>
    </radialGradient>
    <filter id="nodeGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="coreBlur" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>
  <style>
    @keyframes nodePulse { 0%,100% { opacity: 0.65; } 50% { opacity: 1; } }
    @keyframes corePulse { 0%,100% { transform: scale(1); opacity: 0.75; } 50% { transform: scale(1.18); opacity: 1; } }
    @keyframes ringBreathe { 0%,100% { opacity: 0.35; } 50% { opacity: 0.75; } }
    .node { animation: nodePulse 2.6s ease-in-out infinite; }
    .core { animation: corePulse 4s ease-in-out infinite; transform-origin: 600px 340px; }
    .orbits { animation: ringBreathe 6s ease-in-out infinite; }
    text { font-family: 'SF Mono','Fira Code',monospace; }
  </style>

  <rect width="1200" height="680" fill="#0a0a0f"/>
  <circle cx="600" cy="340" r="320" fill="url(#coreGlow)"/>

  <g class="orbits"><circle cx="600" cy="340" r="100" fill="none" stroke="#2a2a3a" stroke-width="1" stroke-dasharray="1,7" opacity="0.6"/><circle cx="600" cy="340" r="190" fill="none" stroke="#2a2a3a" stroke-width="1" stroke-dasharray="1,7" opacity="0.6"/><circle cx="600" cy="340" r="280" fill="none" stroke="#2a2a3a" stroke-width="1" stroke-dasharray="1,7" opacity="0.6"/></g>
