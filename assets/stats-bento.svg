<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glass" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4"/>
    </filter>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4"/><stop offset="100%" stop-color="#00bbf9"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9b5de5"/><stop offset="100%" stop-color="#f15bb5"/>
    </linearGradient>
    <linearGradient id="g3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fee440"/><stop offset="100%" stop-color="#f15bb5"/>
    </linearGradient>
    <linearGradient id="g4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00bbf9"/><stop offset="100%" stop-color="#9b5de5"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#1a1a2e" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0a0a0f" stop-opacity="1"/>
    </radialGradient>
  </defs>
  <style>
    @keyframes rise {
      0% { transform: translateY(30px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }
    @keyframes barGrow {
      0% { transform: scaleX(0); }
      100% { transform: scaleX(1); }
    }
    @keyframes cardFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    @keyframes numberGlow {
      0%, 100% { filter: url(#glow); }
      50% { filter: none; }
    }
    .card { animation: cardFloat 7s ease-in-out infinite; }
    .card:nth-of-type(2) { animation-delay: -1.75s; }
    .card:nth-of-type(3) { animation-delay: -3.5s; }
    .card:nth-of-type(4) { animation-delay: -5.25s; }
    .bar { transform-origin: left; animation: barGrow 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .stat-num { animation: numberGlow 3s ease-in-out infinite; }
    text { font-family: 'SF Mono','Fira Code',monospace; }
  </style>

  <rect width="1200" height="320" fill="url(#bgGlow)"/>

  <!-- Stat Cards Row -->
  <g class="card" transform="translate(30,25)">
    <rect width="270" height="120" rx="14" fill="#12121a" stroke="url(#g1)" stroke-width="1.5" filter="url(#glass)" opacity="0.95"/>
    <text x="24" y="42" fill="#8b93a8" font-size="11" letter-spacing="2">PUBLIC REPOS</text>
    <text x="24" y="88" fill="url(#g1)" font-size="42" font-weight="bold" class="stat-num">48</text>
    <circle cx="235" cy="30" r="4" fill="#00f5d4" filter="url(#glow)"/>
  </g>

  <g class="card" transform="translate(315,25)">
    <rect width="270" height="120" rx="14" fill="#12121a" stroke="url(#g2)" stroke-width="1.5" filter="url(#glass)" opacity="0.95"/>
    <text x="24" y="42" fill="#8b93a8" font-size="11" letter-spacing="2">PULL REQUESTS</text>
    <text x="24" y="88" fill="url(#g2)" font-size="42" font-weight="bold" class="stat-num">31</text>
    <circle cx="235" cy="30" r="4" fill="#f15bb5" filter="url(#glow)"/>
  </g>

  <g class="card" transform="translate(600,25)">
    <rect width="270" height="120" rx="14" fill="#12121a" stroke="url(#g3)" stroke-width="1.5" filter="url(#glass)" opacity="0.95"/>
    <text x="24" y="42" fill="#8b93a8" font-size="11" letter-spacing="2">MERGED</text>
    <text x="24" y="88" fill="url(#g3)" font-size="42" font-weight="bold" class="stat-num">26</text>
    <circle cx="235" cy="30" r="4" fill="#fee440" filter="url(#glow)"/>
  </g>

  <g class="card" transform="translate(885,25)">
    <rect width="270" height="120" rx="14" fill="#12121a" stroke="url(#g4)" stroke-width="1.5" filter="url(#glass)" opacity="0.95"/>
    <text x="24" y="42" fill="#8b93a8" font-size="11" letter-spacing="2">ORGS CONTRIBUTED</text>
    <text x="24" y="88" fill="url(#g4)" font-size="42" font-weight="bold" class="stat-num">10+</text>
    <circle cx="235" cy="30" r="4" fill="#00bbf9" filter="url(#glow)"/>
  </g>

  <!-- Language mix bar -->
  <g transform="translate(30,175)">
    <text x="0" y="0" fill="#8b93a8" font-size="12" letter-spacing="2">LANGUAGE DISTRIBUTION — 48 REPOSITORIES</text>
    <g transform="translate(0,18)">
      <rect x="0" y="0" width="1140" height="28" rx="6" fill="#12121a" stroke="#2a2a3a"/>
      <!-- segments: TS 9, HTML 7, JS 4, Python 4, C 1, Cuda 1, Rust 1, Solidity 1, other 20 -->
      <rect class="bar" x="2" y="2" width="374" height="24" rx="4" fill="#3178c6"/>
      <rect class="bar" x="378" y="2" width="291" height="24" rx="0" fill="#e34c26" style="animation-delay:.05s"/>
      <rect class="bar" x="671" y="2" width="166" height="24" rx="0" fill="#f1e05a" style="animation-delay:.1s"/>
      <rect class="bar" x="839" y="2" width="166" height="24" rx="0" fill="#3572A5" style="animation-delay:.15s"/>
      <rect class="bar" x="1007" y="2" width="42" height="24" rx="0" fill="#76b900" style="animation-delay:.2s"/>
      <rect class="bar" x="1051" y="2" width="42" height="24" rx="0" fill="#dea584" style="animation-delay:.25s"/>
      <rect class="bar" x="1095" y="2" width="43" height="24" rx="4" fill="#363636" style="animation-delay:.3s"/>
    </g>
    <g transform="translate(0,68)" font-size="11" fill="#c9d1d9">
      <circle cx="6" cy="0" r="5" fill="#3178c6"/><text x="16" y="4">TypeScript 41%</text>
      <circle cx="150" cy="0" r="5" fill="#e34c26"/><text x="160" y="4">HTML 25%</text>
      <circle cx="270" cy="0" r="5" fill="#f1e05a"/><text x="280" y="4">JavaScript 15%</text>
      <circle cx="420" cy="0" r="5" fill="#3572A5"/><text x="430" y="4">Python 15%</text>
      <circle cx="570" cy="0" r="5" fill="#76b900"/><text x="580" y="4">CUDA/C</text>
      <circle cx="680" cy="0" r="5" fill="#dea584"/><text x="690" y="4">Rust</text>
      <circle cx="770" cy="0" r="5" fill="#363636"/><text x="780" y="4">Solidity</text>
    </g>
  </g>
</svg>